name: hemoconnect
description: "HemoConnect - HealthTech Blood Donation & Emergency Blood Management Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase & Auth
  supabase_flutter: ^2.8.0

  # Storage & Utilities
  file_picker: ^8.1.4
  open_file: ^3.5.1
  shared_preferences: ^2.3.5
  intl: ^0.19.0

  # UI & Charts
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  cupertino_icons: ^1.0.8
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true